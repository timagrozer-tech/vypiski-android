name: REVVL Camera Lab — one-off APK build (branch revvl-camera-lab only)
on:
  # Temporary trigger requested explicitly by the owner to build the APK once.
  # Runs ONLY for pushes to this branch; it is deleted right after the build.
  push:
    branches: [revvl-camera-lab]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only to publish the APK to branch revvl-camera-lab-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Default 'tools' package no longer exists in cmdline-tools 16+; install only what is needed.
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Kotlin
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: REVVL-Camera-Lab-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Publish APK to branch revvl-camera-lab-apk (direct download without Actions artifacts)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/apkbranch && cd /tmp/apkbranch
          git init -q -b revvl-camera-lab-apk
          cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" REVVL-Camera-Lab-0.3.9-debug.apk
          sha256sum REVVL-Camera-Lab-0.3.9-debug.apk > REVVL-Camera-Lab-0.3.9-debug.apk.sha256
          printf 'REVVL Camera Lab 0.3.9 debug APK, built from %s (branch revvl-camera-lab).\n' "$GITHUB_SHA" > README.txt
          git add . && git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "REVVL Camera Lab 0.3.9 debug APK (${GITHUB_SHA::7})"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:revvl-camera-lab-apk
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: REVVL-Camera-Lab-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
