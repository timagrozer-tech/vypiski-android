name: Android CI

on:
  push:
    branches: [ main, scanner291 ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Тесты, проверки офлайн-режима, Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # только для публикации снимков экранов в ветку scanner291-screenshots
    steps:
      - uses: actions/checkout@v5

      - name: Проверка Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Структура проекта
        run: tools/ci/gradle.sh projects

      - name: Unit-тесты чистых JVM-модулей (ФИО, имена файлов, водяной знак, хранилище, качество)
        run: tools/ci/gradle.sh :core:common:test :core:intelligence:test :core:quality:test

      - name: Проверка OCR-моделей (SHA-256)
        run: tools/ci/gradle.sh :core:ocr:verifyTessdata

      - name: Unit-тесты Android-модулей
        run: tools/ci/gradle.sh testDebugUnitTest

      - name: Снимки дизайн-системы (Roborazzi, светлая и тёмная темы)
        run: tools/ci/gradle.sh :core:designsystem:recordRoborazziDebug

      - name: Снимки экранов приложения (Roborazzi, настоящие данные)
        run: tools/ci/gradle.sh :app:recordRoborazziDebug --tests '*AppScreenshotTest'

      - name: Артефакт снимков
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            core/designsystem/build/outputs/roborazzi/
            app/build/outputs/roborazzi/
          if-no-files-found: error

      - name: Публикация снимков в ветку scanner291-screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/scanner291'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D="$RUNNER_TEMP/shots"; mkdir -p "$D"
          cp app/build/outputs/roborazzi/*.png core/designsystem/build/outputs/roborazzi/*.png "$D"/
          cd "$D"
          printf '# Снимки экранов 291 Сканер\n\nКоммит %s, %s. Ветка перезаписывается при каждой сборке.\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > README.md
          git init -q -b scanner291-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Снимки экранов для ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:scanner291-screenshots
          echo "::notice title=Снимки экранов::$(ls *.png | wc -l) файлов → ветка scanner291-screenshots"

      - name: Офлайн-режим — нет INTERNET и сетевых SDK
        run: tools/ci/gradle.sh :app:verifyNoNetwork

      - name: Lint
        run: tools/ci/gradle.sh :app:lintDebug

      - name: Сборка Debug APK
        run: tools/ci/gradle.sh :app:assembleDebug

      - name: Контрольные суммы APK
        run: |
          cd app/build/outputs/apk/debug
          ls -la
          sha256sum *.apk | tee SHA256SUMS.txt
          # Размеры и суммы — в сводку запуска (видны без скачивания артефакта)
          for f in *.apk; do echo "::notice title=APK $f::$(du -h "$f" | cut -f1) sha256=$(sha256sum "$f" | cut -c1-64)"; done

      - name: Выравнивание нативных библиотек под страницы 16 КБ (Android 15+)
        shell: bash
        run: |
          ZA=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          for f in app/build/outputs/apk/debug/*.apk; do
            if "$ZA" -c -P 16 -v 4 "$f" > za.txt 2>&1; then
              echo "::notice title=16 KB $(basename "$f")::OK — все .so выровнены"
            else
              bad=$(grep -E '\.so' za.txt | grep -v 'OK' | sed 's/^ *//' | head -20 | tr '\n' ';')
              echo "::warning title=16 KB $(basename "$f")::Не выровнено: $bad"
            fi
          done
          # ELF-сегменты: максимальное выравнивание LOAD должно быть >= 2**14
          mkdir -p so && unzip -q -o app/build/outputs/apk/debug/app-arm64-v8a-debug.apk 'lib/*' -d so || true
          for so in so/lib/arm64-v8a/*.so; do
            al=$(readelf -lW "$so" | awk '/LOAD/{print $NF; exit}')
            echo "$(basename "$so") $al"
          done | tee elf.txt
          echo "::notice title=ELF LOAD align (arm64)::$(tr '\n' ';' < elf.txt)"

      - name: Артефакт Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scanner291-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error

      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  instrumented:
    name: Инструментальные тесты (эмулятор API 34)
    runs-on: ubuntu-latest
    needs: build
    # Тесты на эмуляторе (30–60 мин) — только вручную (Actions → Run workflow), не на каждый push.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Тесты на эмуляторе (сеть эмулятора отключена — проверка офлайн-режима)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back emulated
          script: tools/ci/emulator-tests.sh

  release:
    name: Подписанный Release APK
    runs-on: ubuntu-latest
    needs: build
    # Только вручную и только при наличии секретов подписи.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Восстановление keystore из секрета
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Секрет SIGNING_KEYSTORE_BASE64 не задан — см. docs/SIGNING.md"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SCANNER291_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Сборка Release
        env:
          SCANNER291_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SCANNER291_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SCANNER291_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: tools/ci/gradle.sh :app:verifyNoNetwork :app:assembleRelease
      - name: Проверка подписи
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/release/*.apk; do "$APKSIGNER" verify --print-certs "$f"; done
          cd app/build/outputs/apk/release && sha256sum *.apk | tee SHA256SUMS.txt
      - name: Удаление keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: scanner291-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
