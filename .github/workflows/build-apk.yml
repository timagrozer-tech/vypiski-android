name: Build Vypiski APK

# Manual only: the APK is built only on an explicit command (Actions → Build Vypiski APK → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write  # only to attach the APK to an existing release v<version>

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the newest Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n 1 || true)
          test -n "$ZIP" || { echo 'Project ZIP not found'; exit 1; }
          echo "Using $ZIP"
          mkdir -p android-project
          unzip -q "$ZIP" -d android-project
          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle
          test -s android-project/app/src/main/assets/index.html
          if grep -q 'android.permission.INTERNET' android-project/app/src/main/AndroidManifest.xml; then echo 'INTERNET permission must not be declared'; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android-project :app:assembleDebug --no-daemon --stacktrace

      - name: Check APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK=android-project/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep 'assets/ocr/' || true
          if [ -f android-project/app/src/main/assets/ocr/rus.traineddata.bin ]; then unzip -l "$APK" | grep -q 'assets/ocr/rus.traineddata.bin'; unzip -l "$APK" | grep -q 'assets/ocr/tesseract-core-simd-lstm.wasm.js'; fi
          ls -la "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vypiski-Android-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release (only if release v<version> exists)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP "versionName\s+'\K[^']+" android-project/app/build.gradle)
          if gh release view "v$V" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            cp android-project/app/build/outputs/apk/debug/app-debug.apk "Vypiski-$V.apk"
            gh release upload "v$V" "Vypiski-$V.apk" --clobber --repo "${{ github.repository }}"
          else echo "no release v$V — skipped"; fi
