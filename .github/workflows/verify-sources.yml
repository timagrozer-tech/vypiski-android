name: Verify sources (no APK)
on:
  # Manual only. This workflow compiles Kotlin and runs unit tests; it never packages an APK/AAB.
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check CameraX calls against official API signature files
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/androidx/androidx /tmp/ax
          git -C /tmp/ax sparse-checkout set --no-cone '/camera/*/api/*'
          tools/api-check/check-apis.sh /tmp/ax 1.6.0-rc01
      - name: Check Android framework calls against AOSP API 36 signature files
        run: |
          git clone -q --depth 1 --branch android16-release --filter=blob:none --sparse https://github.com/aosp-mirror/platform_frameworks_base /tmp/fwb
          git -C /tmp/fwb sparse-checkout set --no-cone '/core/api/current.txt'
          git clone -q --depth 1 --branch android16-release --filter=blob:none --sparse https://github.com/aosp-mirror/platform_packages_providers_mediaprovider /tmp/mp
          git -C /tmp/mp sparse-checkout set --no-cone '/apex/framework/api/current.txt'
          python3 tools/api-check/check-framework-apis.py /tmp/fwb/core/api/current.txt /tmp/mp/apex/framework/api/current.txt
      - name: Compile Kotlin against Android SDK and CameraX (no packaging)
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compile instrumented tests (no packaging, not run)
        run: gradle --no-daemon :app:compileDebugAndroidTestKotlin
      - name: Android lint (report only)
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REVVL-Camera-Lab-verify-reports
          path: |
            app/build/reports/
            app/build/test-results/
