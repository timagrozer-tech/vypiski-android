name: Build Vypiski for Windows

# Manual only: installers are built only on an explicit command (Actions → Build Vypiski for Windows → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Take the page from the newest project ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter 'Vypiski-Android-Stage-*-project.zip' |
            Sort-Object { $m = [regex]::Match($_.Name, 'Stage-(\d+)-(\d+)'); [int]$m.Groups[1].Value * 1000 + [int]$m.Groups[2].Value } |
            Select-Object -Last 1
          if (-not $zip) { throw 'Project ZIP not found' }
          Write-Host "Using $($zip.Name)"
          Expand-Archive -Path $zip.FullName -DestinationPath project -Force
          New-Item -ItemType Directory -Force -Path desktop/app | Out-Null
          Copy-Item project/app/src/main/assets/index.html desktop/app/index.html
          $ver = (Select-String -Path desktop/app/index.html -Pattern 'name="vypiski-version" content="([0-9.]+)"').Matches[0].Groups[1].Value
          Write-Host "Page version $ver"
          if ((Get-Item desktop/app/index.html).Length -lt 100000) { throw 'index.html looks wrong' }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installer and portable .exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: List output
        shell: pwsh
        run: Get-ChildItem desktop/dist -Filter *.exe | Format-Table Name, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Vypiski-Windows
          path: |
            desktop/dist/Vypiski-Setup-*.exe
            desktop/dist/Vypiski-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
