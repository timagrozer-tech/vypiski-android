name: Build Vypiski for Windows

# Manual only: installers are built only on an explicit command (Actions → Build Vypiski for Windows → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write  # only to attach the installer to an existing release v<version>

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Take the page from the newest project ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter 'Vypiski-Android-Stage-*-project.zip' |
            Sort-Object { $m = [regex]::Match($_.Name, 'Stage-(\d+)-(\d+)'); [int]$m.Groups[1].Value * 1000 + [int]$m.Groups[2].Value } |
            Select-Object -Last 1
          if (-not $zip) { throw 'Project ZIP not found' }
          Write-Host "Using $($zip.Name)"
          Expand-Archive -Path $zip.FullName -DestinationPath project -Force
          New-Item -ItemType Directory -Force -Path desktop/app | Out-Null
          Copy-Item project/app/src/main/assets/index.html desktop/app/index.html
          if (Test-Path project/app/src/main/assets/ocr) { Copy-Item project/app/src/main/assets/ocr desktop/app/ocr -Recurse -Force }
          $ver = (Select-String -Path desktop/app/index.html -Pattern 'name="vypiski-version" content="([0-9.]+)"').Matches[0].Groups[1].Value
          Write-Host "Page version $ver"
          if ((Get-Item desktop/app/index.html).Length -lt 100000) { throw 'index.html looks wrong' }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installer and portable .exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Checksums and a silent install check
        shell: pwsh
        run: |
          $out = Get-ChildItem desktop/dist -Filter *.exe
          $out | Format-Table Name, Length
          $sums = foreach ($f in $out) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name }
          $sums | Set-Content -Encoding ascii desktop/dist/SHA256.txt
          $sums
          # the installer must install silently and leave Vypiski.exe; then it is removed again
          $setup = ($out | Where-Object Name -like 'Vypiski-Setup-*').FullName
          $p = Start-Process $setup -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 5
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs","$env:ProgramFiles","${env:ProgramFiles(x86)}" -Recurse -Filter 'Vypiski.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'installed program not found' }
          Write-Host "Installed: $($exe.FullName) $($exe.Length)"
          $un = Get-ChildItem $exe.DirectoryName -Filter 'Uninstall*.exe' | Select-Object -First 1
          if ($un) { Start-Process $un.FullName -ArgumentList '/S' -Wait }

      # two downloads instead of one 180 MB archive; stored without compression (the .exe files are compressed already) —
      # a smaller download that breaks less often and unpacks with any archiver
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Vypiski-Windows-Setup
          path: |
            desktop/dist/Vypiski-Setup-*.exe
            desktop/dist/SHA256.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Vypiski-Windows-Portable
          path: |
            desktop/dist/Vypiski-Portable-*.exe
            desktop/dist/SHA256.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release (only if release v<version> exists)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          if gh release view "v$V" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "v$V" desktop/dist/Vypiski-Setup-*.exe desktop/dist/Vypiski-Portable-*.exe --clobber --repo "${{ github.repository }}"
          else echo "no release v$V — skipped"; fi

  # the archives are downloaded back and checked: they open and the files match the checksums
  verify:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: got
      - name: Check
        shell: pwsh
        run: |
          foreach ($d in Get-ChildItem got -Directory) {
            $sums = Get-Content (Join-Path $d.FullName 'SHA256.txt')
            foreach ($f in Get-ChildItem $d.FullName -Filter *.exe) {
              $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
              if (-not ($sums -match "^$h  $([regex]::Escape($f.Name))$")) { throw "checksum mismatch: $($f.Name)" }
              Write-Host "OK $($d.Name)/$($f.Name) $($f.Length)"
            }
          }
