name: Check downloaded archives

# Manual: downloads the artifact ZIP files exactly as a browser does and tests them with 7-Zip (no build)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'run id of «Build Vypiski for Windows»'
        required: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Download and test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ids = gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}/artifacts" --jq '.artifacts[] | "\(.id) \(.name)"'
          foreach ($l in $ids) { $id,$name = $l -split ' ',2
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "$name.zip"
            $len=(Get-Item "$name.zip").Length; Write-Host "== $name.zip $len bytes"
            & 7z t "$name.zip"; Write-Host "7z exit $LASTEXITCODE"
            & 7z l -slt "$name.zip" | Select-String 'Path|Size|CRC|Method'
            Expand-Archive "$name.zip" -DestinationPath "x_$name" -Force
            Get-ChildItem "x_$name" | ForEach-Object { "{0} {1} {2}" -f $_.Name,$_.Length,(Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          }
