name: Instrumented tests on emulator (builds test APKs)
on:
  # Manual only. This workflow BUILDS debug + test APKs on the GitHub runner and installs them
  # into a disposable emulator. Run it only when building APKs is allowed. Never on push.
  workflow_dispatch:
jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run instrumented tests (emulated back camera)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REVVL-Camera-Lab-instrumented-reports
          path: app/build/reports/androidTests/
